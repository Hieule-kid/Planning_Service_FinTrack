services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fintrack_planning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-net

  # ── Planning Service ────────────────────────────────────────────────────────
  planning-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Needed to resolve com.fintrack:core from GitHub Packages during
        # the build — export these in your shell (or put in .env) first.
        GITHUB_ACTOR: ${GITHUB_ACTOR}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: fintrack/planning-service:latest
    restart: always
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/fintrack_planning
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # config-service (Eureka) runs in a separate repo/container — point this
      # at wherever it's reachable from this container (default: host machine).
      EUREKA_HOST: ${EUREKA_HOST:-host.docker.internal}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      FINTRACK_JWT_SECRET: ${FINTRACK_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack-net

volumes:
  postgres_data:

networks:
  fintrack-net:
    driver: bridge
